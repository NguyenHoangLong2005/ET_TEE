name: ettee_staff
description: ET Tee staff mobile app - sales, warehouse, shipping.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.4.3+1
  equatable: ^2.0.5
  get_it: ^7.6.2
  go_router: ^14.2.0
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  logger: ^2.3.0
  permission_handler: ^11.3.0

  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  printing: ^5.12.0
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/