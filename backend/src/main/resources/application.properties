spring.application.name=fashion-backend
server.port=8081

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fashion_db?sslmode=disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema do Flyway quan ly. Hibernate chi doi chieu entity voi schema, khong sua schema.
spring.jpa.hibernate.ddl-auto=validate

# Flyway
# DB that da co flyway_schema_history voi 1 dong BASELINE = 20260908000000.
# V1__baseline.sql co version thap hon baseline nen bi BO QUA tren DB do; no chi
# duoc dung de dung lai schema tu dau tren mot database rong (dev/staging moi).
# Cac file migration cu nam o db/legacy-migration/ va KHONG con duoc quet.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
# CANH BAO: DB_URL tro toi Supabase transaction pooler (cong 6543). Flyway can
# advisory lock o muc session nen KHONG chay on dinh qua pooler transaction mode.
# Dat DB_MIGRATION_URL trong .env tro toi ket noi truc tiep (cong 5432) truoc khi
# chay migration. Xem docs/flyway.md.
spring.flyway.url=${DB_MIGRATION_URL:${DB_URL}}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
