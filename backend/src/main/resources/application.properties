spring.application.name=fashion-backend
server.port=8081

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fashion_db?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema do Flyway quan ly. Hibernate chi doi chieu entity voi schema, khong sua schema.
spring.jpa.hibernate.ddl-auto=validate

# Flyway
# DB that da co flyway_schema_history voi 1 dong BASELINE = 20260908000000.
# V1__baseline.sql co version thap hon baseline nen bi BO QUA tren DB do; no chi
# duoc dung de dung lai schema tu dau tren mot database rong (dev/staging moi).
# Cac file migration cu nam o db/legacy-migration/ va KHONG con duoc quet.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
# CANH BAO: DB_URL tro toi Supabase transaction pooler (cong 6543). Flyway can
# advisory lock o muc session nen KHONG chay on dinh qua pooler transaction mode.
# Dat DB_MIGRATION_URL trong .env tro toi ket noi truc tiep (cong 5432) truoc khi
# chay migration. Xem docs/flyway.md.
spring.flyway.url=${DB_MIGRATION_URL:${DB_URL}}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# SMTP Configuration (Fail fast if empty via @Value validation in code)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM}

# Demo staff accounts (admin@et.tee, sales@et.tee, ...).
# MUST stay false outside local development: enabling it creates privileged
# accounts with a shared bootstrap password. When enabled without an explicit
# password a random one is generated and logged once. Seeded accounts are always
# forced to change their password at first login.
app.seed.demo-accounts.enabled=${SEED_DEMO_ACCOUNTS:false}
app.seed.demo-accounts.password=${SEED_DEMO_PASSWORD:}

# Security
app.jwt.secret=${AUTH_SECRET}
app.jwt.expiration=86400000
app.datafix.kids-gender.enabled=true
app.datafix.saleprice.enabled=false
app.datafix.saleprice.target-share=0.35
app.datafix.saleprice.report-path=sale-price-fix-report.md

# Payment Config
app.payment.bank.account-name=${BANK_ACCOUNT_NAME:Nguyen Hoang Long}
app.payment.bank.account-number=${BANK_ACCOUNT_NUMBER:0968623156}
app.payment.bank.name=${BANK_NAME:MBBank}
app.payment.bank.qr-url=${BANK_QR_URL:https://qr.sepay.vn/img}
# API key set in SePay > Webhooks ("Apikey" auth). Empty = webhook disabled, staff confirm transfers by hand.
app.payment.sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
# PayOS hosted checkout (my.payos.vn > Kênh thanh toán). All three empty = PayOS off, plain QR only.
app.payment.payos.client-id=${PAYOS_CLIENT_ID:}
app.payment.payos.api-key=${PAYOS_API_KEY:}
app.payment.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
# Storefront origin PayOS sends the customer back to.
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Application log file. The admin "Nhat ky may chu" page reads logs/application.log (path relative to the
# directory the backend is started from), rotated by size so it cannot fill the disk.
logging.file.name=${LOG_FILE:logs/application.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=200MB
# DEV ONLY: write the sign-up/reset OTP to the log when sending the email fails (default: never).
app.mail.log-otp-on-failure=${LOG_OTP_ON_MAIL_FAILURE:false}

# Product image uploads (store owner). Files are served back under /api/uploads/** so the
# Next.js /api proxy reaches them without extra config.
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
