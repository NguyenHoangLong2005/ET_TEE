spring.application.name=fashion-backend
server.port=8081

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fashion_db?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# SMTP Configuration (Fail fast if empty via @Value validation in code)
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USER:nhl.tailieu1309@gmail.com}
spring.mail.password=${SMTP_PASS:zkrr vmur kmqs mhfx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${SMTP_FROM:nhl.tailieu1309@gmail.com}

# Security
app.jwt.secret=${AUTH_SECRET}
app.jwt.expiration=86400000
app.datafix.kids-gender.enabled=true
app.datafix.saleprice.enabled=false
