# Demo staff accounts (admin@et.tee, sales@et.tee, ...).
# MUST stay false outside local development: enabling it creates privileged
# accounts with a shared bootstrap password. When enabled without an explicit
# password a random one is generated and logged once. Seeded accounts are always
# forced to change their password at first login.
app.seed.demo-accounts.enabled=${SEED_DEMO_ACCOUNTS:false}
app.seed.demo-accounts.password=${SEED_DEMO_PASSWORD:}

